name: ci

# CI 上没有 Rhino。这里验证的是：已提交的 .3dm、IFC、CSV 和 README 互相对得上，
# 并且都能由仓库里的代码重算出来。Rhino 那一步（rhino/build_model.py）在本机跑，
# 它的产物 model/bridge_bim.3dm 由 rhino3dm 独立读回来核。

on:
  push:
  pull_request:

jobs:
  core-py39:
    # bridge/ 只用标准库，并且必须兼容 Python 3.9——Rhino 8 内置的 CPython 就是 3.9，
    # Rhino 里的建模脚本 import 的是同一份代码。这一步不装任何依赖，保证核心不偷偷依赖第三方库。
    # 钉 ubuntu-24.04：ubuntu-latest 已是 26.04，setup-python 没有它的 3.9 构建。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Alignment, model, schedule and structure tests (a counterexample per check) — stdlib only
        run: python -m unittest tests.test_alignment tests.test_model tests.test_schedule tests.test_structure tests.test_replay tests.test_construction tests.test_construction_input tests.test_stage_results tests.test_plan_ages -v
      - name: data/ is exactly what the model computes
        run: python scripts/build_data.py --check

  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: requirements files are ASCII (old pip reads them in the locale code page, e.g. GBK on Chinese Windows)
        run: python scripts/check_ascii.py requirements*.txt
      - run: pip install -r requirements.txt
      - name: Full test suite (.3dm ↔ CSV ↔ IFC, geometry engine, alignment kernel, 4D, schema, OpenSees cross-check)
        env:
          REQUIRE_OPENSEES: "1"          # 装不上 / 加载失败就报错，不许把 OpenSees 互核静默跳过
        run: python -m pytest tests -v
      - name: IFC equals a fresh export
        run: python scripts/export_ifc.py --check
      - name: Independent source geometry and reference-profile provenance
        run: python scripts/check_source.py
      - name: IDS delivery information requirements
        run: python scripts/check_ids.py --no-write-reports
      - name: Verify saved native three-dimensional quality report
        run: python scripts/check_spatial_quality.py
      - name: Independently read every saved native replay and stage result
        run: python scripts/check_replay.py --all
      - name: Verify native time panel document lifecycle evidence
        run: python scripts/check_lifecycle.py
      - name: Read native project approval gate fixtures
        run: python scripts/check_project_gates.py
      - name: Every number in README is recomputed from the artifacts
        run: python scripts/check_readme.py
      - name: Standard IFC construction resources and calendar
        run: python scripts/check_construction_resources.py
      - name: Complete delivery input and artifact fingerprints
        run: python scripts/delivery.py --check --manifest-only

  windows:
    # README 的 PowerShell 复现命令原样跑一遍：用 venv 自带的 pip（不升级）装依赖，
    # 证明 requirements.txt 在 Windows 上不靠新版 pip 也能读；再跑标准库测试、回算 README、重导 IFC 比对。
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: requirements files are ASCII
        run: python scripts/check_ascii.py requirements*.txt
      - name: venv with the bundled pip, then the README install command
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip --version
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
      - name: Standard-library tests
        run: .\.venv\Scripts\python.exe -m unittest tests.test_alignment tests.test_model tests.test_schedule tests.test_structure tests.test_replay tests.test_construction tests.test_construction_input tests.test_stage_results tests.test_plan_ages
      - name: data/ is exactly what the model computes
        run: .\.venv\Scripts\python.exe scripts\build_data.py --check
      - name: Every number in README and docs/ is recomputed from the artifacts
        run: .\.venv\Scripts\python.exe scripts\check_readme.py
      - name: IFC equals a fresh export
        run: .\.venv\Scripts\python.exe scripts\export_ifc.py --check
